rder="stroke"><tspan x="617.55" dy="0">14b Save TR-07 and reason; keep owner; append audit</tspan></text><text x="450.0" y="643" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="450.0" dy="0">15b Notify releasing representative to</tspan><tspan x="450.0" dy="21.599999999999998">resolve or arrange return</tspan></text><text x="506.0" y="714" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="506.0" dy="0">16b Notify receiving representative to</tspan><tspan x="506.0" dy="21.599999999999998">resolve or arrange return</tspan></text><rect x="10" y="348" width="880" height="424" fill="none" stroke="#6e8378"/><rect x="10" y="348" width="42" height="27" rx="0" fill="white" stroke="#385247"/><text x="31.0" y="366.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><tspan x="31.0" dy="0">alt</tspan></text><text x="64" y="368" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="64" dy="0">[agreed receipt]</tspan></text><rect x="15" y="792" width="870" height="85" rx="0" fill="#fff6e3" stroke="#385247"/><text x="450.0" y="819.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0">Dispute resolution permits receipt, or return with TR-09 and released quantity. Rejection</tspan><tspan x="450.0" dy="20.4">-&gt; TR-08; pre-handover cancellation -&gt; TR-09. Record reasons, release held units once and</tspan><tspan x="450.0" dy="20.4">notify.</tspan></text></svg>