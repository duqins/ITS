t="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="820.0" y="263.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="820.0" dy="0"></tspan></text><text x="450.0" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0">8 Request independent hold confirmation;</tspan><tspan x="450.0" dy="21.599999999999998">verify if &gt;90 days</tspan></text><rect x="631" y="323" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="635.0" y="334.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="635.0" dy="0"></tspan></text><text x="450.0" y="361" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0">9 Confirm stock, condition and proposed</tspan><tspan x="450.0" dy="21.599999999999998">5-working-day hold</tspan></text><rect x="261" y="394" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="265.0" y="405.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="265.0" dy="0"></tspan></text><text x="542.5" y="432" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="542.5" dy="0">10 Atomic lock: recheck units; save RV-02 and audit</tspan></text><rect x="816" y="443" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="820.0" y="454.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="820.0" dy="0"></tspan></text><text x="218.10000000000002" y="481" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="218.10000000000002" dy="0">11 Show held units, expiry and pending</tspan><tspan x="218.10000000000002" dy="21.599999999999998">transfer approval</tspan></text><rect x="15" y="539" width="870" height="85" rx="0" fill="#fff6e3" stroke="#385247"/><text x="450.0" y="566.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0">Conflict or decline: no double hold; RV-03 on decline, RQ-03 restored.</tspan><tspan x="450.0" dy="20.4">Expiry without approved transfer: release units once. Proceeding creates TR-01, RV-04 and</tspan><tspan x="450.0" dy="20.4">RQ-05; see Figure 9.5.</tspan></text></svg>