><ns0:tspan x="260.0" dy="19.2">approval?</ns0:tspan></ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="336" y="635.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><ns0:tspan x="336" dy="0">[no]</ns0:tspan></ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="95" y="655" width="330" height="48" rx="9" fill="#f0f5f1" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="260.0" y="674.84" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><ns0:tspan x="260.0" dy="0">Record parts, labour, cost and outcome</ns0:tspan><ns0:tspan x="260.0" dy="19.2">MW-06; restore AS-02 or AS-03</ns0:tspan></ns0:text><ns0:ellipse xmlns:ns0="http://www.w3.org/2000/svg" cx="260.0" cy="745.0" rx="10.0" ry="10.0" fill="white" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="260.0" y="750.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><ns0:tspan x="260.0" dy="0" /></ns0:text><ns0:circle xmlns:ns0="http://www.w3.org/2000/svg" cx="260" cy="745" r="6" fill="#243b33" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="90" y="449" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><ns0:tspan x="90" dy="0">[yes: MW-03]</ns0:tspan></ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="480" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><ns0:tspan x="480" dy="0">[no]</ns0:tspan></ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="435" y="465" width="140" height="60" rx="9" fill="#f0f5f1" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="505.0" y="490.84" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><ns0:tspan x="505.0" dy="0">MW-08 Rejected</ns0:tspan><ns0:tspan x=