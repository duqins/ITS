nchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><ns0:tspan x="1032" dy="0">[reject]</ns0:tspan></ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="992" y="519" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><ns0:tspan x="992" dy="0">[no]</ns0:tspan></ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="640" y="835" width="410" height="55" rx="9" fill="#f0f5f1" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="845.0" y="858.34" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><ns0:tspan x="845.0" dy="0">EL-06; reason; restore previous state</ns0:tspan><ns0:tspan x="845.0" dy="19.2">No action authorised; notify reviewers</ns0:tspan></ns0:text><ns0:ellipse xmlns:ns0="http://www.w3.org/2000/svg" cx="845.0" cy="922.0" rx="10.0" ry="10.0" fill="white" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="845.0" y="927.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><ns0:tspan x="845.0" dy="0" /></ns0:text><ns0:circle xmlns:ns0="http://www.w3.org/2000/svg" cx="845" cy="922" r="6" fill="#243b33" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="670" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><ns0:tspan x="670" dy="0">[changes]</ns0:tspan><ns0:tspan x="670" dy="18.0">[EL-01]</ns0:tspan></ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="45" y="810" width="540" height="110" rx="0" fill="#fff6e3" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="315.0" y="834.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><ns0:tspan x="315.0" dy="0">Guards</ns0:tspan><ns0:tspan x="315.0" dy="18.0">Missing evidence: stay pending; never skip EHS or erasure.</ns0:tsp