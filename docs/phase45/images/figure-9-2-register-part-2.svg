one" stroke="#243b33" stroke-width="1.4" stroke-dasharray="5 4"/><polyline points="825.0,132 825.0,858" fill="none" stroke="#243b33" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="521.0" y="274" width="8" height="213" fill="#cfdfd4" stroke="#385247"/><rect x="821.0" y="345" width="8" height="12" fill="#cfdfd4" stroke="#385247"/><rect x="371.0" y="203" width="8" height="213" fill="#cfdfd4" stroke="#385247"/><rect x="521.0" y="536" width="8" height="213" fill="#cfdfd4" stroke="#385247"/><rect x="821.0" y="607" width="8" height="71" fill="#cfdfd4" stroke="#385247"/><rect x="221.0" y="487" width="8" height="262" fill="#cfdfd4" stroke="#385247"/><rect x="5.0" y="58" width="140" height="74" rx="0" fill="#f0f5f1" stroke="#385247"/><text x="75.0" y="90.84" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="75.0" dy="0">Asset custodian</tspan><tspan x="75.0" dy="19.2">(creator)</tspan></text><rect x="155.0" y="58" width="140" height="74" rx="0" fill="#f0f5f1" stroke="#385247"/><text x="225.0" y="81.24" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="225.0" dy="0">Second custodian</tspan><tspan x="225.0" dy="19.2">or Department</tspan><tspan x="225.0" dy="19.2">representative</tspan></text><rect x="305.0" y="58" width="140" height="74" rx="0" fill="#f0f5f1" stroke="#385247"/><text x="375.0" y="100.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="375.0" dy="0">UI-03</tspan></text><rect x="455.0" y="58" width="140" height="74" rx="0" fill="#f0f5f1" stroke="#385247"/><text x="525.0" y="90.84" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="525.0" dy="0">Asset module</tspan><tspan x="525.0" dy="19.2">Django</tspan></text><rect x="605.0" y="58" width="140" height="74" rx="0" fill="#f0f5f1" stroke="#385247"/><text x="675.0" y="100.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="675.0" dy="0">AI provider</tspan></text><rect x="755.0" y="58" width="140" height="74" rx="0" fill="#f0f5f1" stroke="#385247"/><text x="825.0" y="81.24" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="825.0" dy="0">PostgreSQL</tspan><tspan x="825.0" dy="19.2">records and</tspan><tspan x="825.0" dy="19.2">audit</tspan></text><text x="247.8" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="247.8" dy="0">7 Accept, edit or reject suggestions; submit</tspan><tspan x="247.8" dy="21.599999999999998">the record</tspan></text><text x="450.0" y="241" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="450.0" dy="0">8 Submit; repeat validation and duplicate</tspan><tspan x="450.0" dy="21.599999999999998">check</tspan></text><text x="672.0" y="312" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="672.0" dy="0">9 Save reviewed values and AI responses;</tspan><tspan x="672.0" dy="21.599999999999998">record stays AS-01</tspan></text><text x="450.0" y="383" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="450.0" dy="0">10 Show Draft awaiting independent</tspan><tspan x="450.0" dy="21.599999999999998">confirmation</tspan></text><text x="375.0" y="454" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="375.0" dy="0">11 Assign confirmation to an eligible user</tspan><tspan x="375.0" dy="21.599999999999998">other than the creator (BR-02)</tspan></text><text x="375.0" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="375.0" dy="0">12 Check evidence; confirm the asset (UC-08)</tspan></text><text x="672.0" y="574" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="672.0" dy="0">13 Verify confirmer is not the creator;</tspan><tspan x="672.0" dy="21.599999999999998">transaction: AS-01 to AS-02/AS-03; audit</tspan></text><text x="675.0" y="645" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="675.0" dy="0">14 Commit one record and confirmation</tspan><tspan x="675.0" dy="21.599999999999998">evidence</tspan></text><text x="375.0" y="716" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="375.0" dy="0">15 Show confirmed state and saved</tspan><tspan x="375.0" dy="21.599999999999998">verification details</tspan></text><rect x="15" y="774" width="870" height="64" rx="0" fill="#fff6e3" stroke="#385247"/><text x="450.0" y="801.5799999999999" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0">Invalid fields retain AS-01. Duplicate warning needs confirmation. Correction/rejection</tspan><tspan x="450.0" dy="20.4">needs a reason. A rejected or ineligible confirmation keeps AS-01 with the reason.</tspan></text></svg>