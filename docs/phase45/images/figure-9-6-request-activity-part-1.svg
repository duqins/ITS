#f0f5f1" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="260.0" y="549.84" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><ns0:tspan x="260.0" dy="0">Independent releasing side checks</ns0:tspan><ns0:tspan x="260.0" dy="19.2">verification, condition and quantity</ns0:tspan></ns0:text><ns0:polygon xmlns:ns0="http://www.w3.org/2000/svg" points="260.0,610 370,645.0 260.0,680 150,645.0" fill="#f0f5f1" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="260.0" y="640.84" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><ns0:tspan x="260.0" dy="0">Hold confirmed</ns0:tspan><ns0:tspan x="260.0" dy="19.2">atomically?</ns0:tspan></ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="336" y="699.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><ns0:tspan x="336" dy="0">[yes]</ns0:tspan></ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="95" y="718" width="330" height="48" rx="9" fill="#f0f5f1" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="260.0" y="737.84" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><ns0:tspan x="260.0" dy="0">RV-02; held for proposed 5 working days</ns0:tspan><ns0:tspan x="260.0" dy="19.2">Selecting a match was not approval</ns0:tspan></ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="95" y="795" width="330" height="48" rx="9" fill="#f0f5f1" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="260.0" y="814.84" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><ns0:tspan x="260.0" dy="0">Proceed to transfer: RV-04 / TR-01</ns0:tspan><ns0:tspan x="260.0" dy="19.2">RQ-05; hold deadline retained</ns0:tspan></ns0:text><ns0:ellipse xmlns:ns0="http://www.w3.org/2000/svg" cx="490.0" cy="819.0" rx="15.0" ry="15.0" fill="white" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="490.0" y="824.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><ns0:tspan x="490.0" dy="0">A</ns0:tspan></ns0:text><ns0:ellipse xmlns:ns0="http://www.w3.org/2000/svg" cx="615.0" cy="89.0" rx="15.0" ry="15.0" fill="white" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="615.0" y="94.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><ns0:tspan x="615.0" dy="0">A</ns0:tspan></ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="640" y="65" width="330" height="48" rx="9" fill="#f0f5f1" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="805.0" y="84.84" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><ns0:tspan x="805.0" dy="0">Department release then receipt approval</ns0:tspan><ns0:tspan x="805.0" dy="19.2">TR-01 to TR-02</ns0:tspan></ns0:text><ns0:polygon xmlns:ns0="http://www.w3.org/2000/svg" points="805.0,140 915,175.0 805.0,210 695,175.0" fill="#f0f5f1" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="805.0" y="170.84" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><ns0:tspan x="805.0" dy="0">Policy stages</ns0:tspan><ns0:tspan x="805.0" dy="19.2">required?</ns0:tspan></ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="881" y="225.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><ns0:tspan x="881" dy="0">[yes]</ns0:tspan></ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="640" y="240" width="330" height="48" rx="9" fill="#f0f5f1" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="805.0" y="259.84000000000003" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><ns0:tspan x="805.0" dy="0">Finance and/or Procurement decide</ns0:tspan><ns0:tspan x="805.0" dy="19.2">TR-03; every applicable stage required</ns0:tspan></ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="1055" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><ns0:tspan x="1055" dy="0">[no]</ns0:tspan></ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="640" y="345" width="330" height="48" rx="9" fill="#f0f5f1" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="805.0" y="364.84" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><ns0:tspan x="805.0" dy="0">All stages approve: TR-04</ns0:tspan><ns0:tspan x="805.0" dy="19.2">Releasing custodian records handover</ns0:tspan></ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="640" y="425" width="330" height="48" rx="9" fill="#f0f5f1" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="805.0" y="444.84" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><ns0:tspan x="805.0" dy="0">TR-05 / AS-05</ns0:tspan><ns0:tspan x="805.0" dy="19.2">Releasing department still owns asset</ns0:tspan></ns0:text><ns0:polygon xmlns:ns0="http://www.w3.org/2000/svg" points="805.0,505 915,540.0 805.0,575 695,540.0" fill="#f0f5f1" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="805.0" y="535.84" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><ns0:tspan x="805.0" dy="0">Receipt agrees</ns0:tspan><ns0:tspan x="805.0" dy="19.2">with handover?</ns0:tspan></ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="881" y="597.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><ns0:tspan x="881" dy="0">[yes]</ns0:tspan></ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="640" y="620" width="330" height="64" rx="9" fill="#f0f5f1" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="805.0" y="639.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><ns0:tspan x="805.0" dy="0">Receiving custodian confirms receipt</ns0:tspan><ns0:tspan x="805.0" dy="18.0">TR-06 / RQ-06; AS-02 or AS-03</ns0:tspan><ns0:tspan x="805.0" dy="18.0">New owner, custody and location</ns0:tspan></ns0:text><ns0:ellipse xmlns:ns0="http://www.w3.org/2000/svg" cx="805.0" cy="710.0" rx="10.0" ry="10.0" fill="white" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="805.0" y="715.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><ns0:tspan x="805.0" dy="0" /></ns0:text><ns0:circle xmlns:ns0="http://www.w3.org/2000/svg" cx="805" cy="710" r="6" fill="#243b33" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="115" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><ns0:tspan x="115" dy="0">[changes: RQ-01]</ns0:tspan></ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="467" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><ns0:tspan x="467" dy="0">[reject]</ns0:tspan></ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="435" y="75" width="150" height="60" rx="9" fill="#f0f5f1" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="510.0" y="100.84" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><ns0:tspan x="510.0" dy="0">RQ-08 Rejected</ns0:tspan><ns0:tspan x="510.0" dy="19.2">Reason and notify</ns0:tspan></ns0:text><ns0:ellipse xmlns:ns0="http://www.w3.org/2000/svg" cx="510.0" cy="165.0" rx="10.0" ry="10.0" fill="white" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="510.0" y="170.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><ns0:tspan x="510.0" dy="0" /></ns0:text><ns0:circle xmlns:ns0="http://www.w3.org/2000/svg" cx="510" cy="165" r="6" fill="#243b33" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="119" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><ns0:tspan x="119" dy="0">[no: search again]</ns0:tspan></ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="496" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><ns0:tspan x="496" dy="0">[decline/conflict]</ns0:tspan></ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="605" y="790" width="490" height="145" rx="0" fill="#fff6e3" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="850.0" y="813.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><ns0:tspan x="850.0" dy="0">Exception paths</ns0:tspan><ns0:tspan x="850.0" dy="18.0">Any transfer rejection: TR-08; reason and release units.</ns0:tspan><ns0:tspan x="850.0" dy="18.0">Pre-handover cancellation: TR-09; reason and release.</ns0:tspan><ns0:tspan x="850.0" dy="18.0">Hold expires before approval: release; return to search.</ns0:tspan><ns0:tspan x="850.0" dy="18.0">TR-07 dispute: no owner change; resolve to receipt</ns0:tspan><ns0:tspan x="850.0" dy="18.0">or return and cancel with released quantity.</ns0:tspan><ns0:tspan x="850.0" dy="18.0">AI down or confidence &lt; 0.50: classic search.</ns0:tspan></ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="1015" y="594" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><ns0:tspan x="1015" dy="0">[difference: TR-07]</ns0:tspan></ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="925" y="675" width="200" height="58" rx="9" fill="#f0f5f1" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="1025.0" y="700.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><ns0:tspan x="1025.0" dy="0">Record dispute TR-07</ns0:tspan><ns0:tspan x="1025.0" dy="18.0">Retain owner; notify</ns0:tspan></ns0:text><ns0:ellipse xmlns:ns0="http://www.w3.org/2000/svg" cx="1025.0" cy="759.0" rx="10.0" ry="10.0" fill="white" stroke="#385247" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="1025.0" y="764.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><ns0:tspan x="1025.0" dy="0" /></ns0:text><ns0:circle xmlns:ns0="http://www.w3.org/2000/svg" cx="1025" cy="759" r="6" fill="#243b33" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="575.0" y="962" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#172d27"><ns0:tspan x="575.0" dy="0">Dawra Campus | Zayed Alfadli 100064657 | UC-04 to UC-09; FR-07 to FR-11; BR-02, BR-11 to BR-16</ns0:tspan></ns0:text></svg></svg>