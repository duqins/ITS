end="url(#arrow)"/><polyline points="265,1121 450,1121" fill="none" stroke="#243b33" stroke-width="1.4" marker-end="url(#arrow)"/><polyline points="80,132 80,1271" fill="none" stroke="#243b33" stroke-width="1.4" stroke-dasharray="5 4"/><polyline points="265,132 265,1271" fill="none" stroke="#243b33" stroke-width="1.4" stroke-dasharray="5 4"/><polyline points="450,132 450,1271" fill="none" stroke="#243b33" stroke-width="1.4" stroke-dasharray="5 4"/><polyline points="635,132 635,1271" fill="none" stroke="#243b33" stroke-width="1.4" stroke-dasharray="5 4"/><polyline points="820,132 820,1271" fill="none" stroke="#243b33" stroke-width="1.4" stroke-dasharray="5 4"/><text x="450.0" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#172d27"><tspan x="450.0" dy="0">Figure 9.5 Transfer approvals handover and receipt</tspan></text><rect x="4" y="58" width="152" height="74" rx="0" fill="#f0f5f1" stroke="#385247"/><text x="80.0" y="90.58" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#172d27"><tspan x="80.0" dy="0">Requester and</tspan><tspan x="80.0" dy="20.4">custodians</tspan></text><rect x="189" y="58" width="152" height="74" rx="0" fill="#f0f5f1" stroke="#385247"/><text x="265.0" y="100.78" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#172d27"><tspan x="265.0" dy="0">Transfer module</tspan></text><rect x="374" y="58" width="152" height="74" rx="0" fill="#f0f5f1" stroke="#385247"/><text x="450.0" y="80.38" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0">Releasing /</tspan><tspan x="450.0" dy="20.4">receiving</tspan><tspan x="450.0" dy="20.4">representatives</tspan></text><rect x="559" y="58" width="152" height="74" rx="0" fill="#f0f5f1" stroke="#385247"/><text x="635.0" y="90.58" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#172d27"><tspan x="635.0" dy="0">Finance /</tspan><tspan x="635.0" dy="20.4">Procurement</tspan></text><rect x="744" y="58" width="152" height="74" rx="0" fill="#f0f5f1" stroke="#385247"/><text x="820.0" y="90.58" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#172d27"><tspan x="820.0" dy="0">PostgreSQL</tspan><tspan x="820.0" dy="20.4">records and audit</tspan></text><text x="213.15" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="213.15" dy="0">1 Proceed with confirmed reservation;</tspan><tspan x="213.15" dy="21.599999999999998">arrangements and version</tspan></text><rect x="261" y="203" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="265.0" y="214.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="265.0" dy="0"></tspan></text><text x="542.5" y="241" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="542.5" dy="0">2 Atomic TR-01; RV-04; RQ-05; retain hold deadline</tspan></text><rect x="816" y="252" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="820.0" y="263.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="820.0" dy="0"></tspan></text><text x="357.5" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="357.5" dy="0">3 Release decision, then receipt decision;</tspan><tspan x="357.5" dy="21.599999999999998">BR-02 checks</tspan></text><rect x="446" y="323" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="450.0" y="334.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0"></tspan></text><text x="357.5" y="361" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="357.5" dy="0">4 Approved current stages: TR-01 to TR-02</tspan></text><text x="450.0" y="453" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0">5 Create applicable policy tasks: TR-03</tspan></text><rect x="631" y="464" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="635.0" y="475.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="635.0" dy="0"></tspan></text><text x="450.0" y="502" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0">6 Each required independent decision recorded</tspan></text><rect x="10" y="392" width="880" height="146" fill="none" stroke="#6e8378"/><rect x="10" y="392" width="42" height="27" rx="0" fill="white" stroke="#385247"/><text x="31.0" y="410.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><tspan x="31.0" dy="0">opt</tspan></text><text x="64" y="412" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#172d27"><tspan x="64" dy="0">[Finance threshold and/or procurement flag applies]</tspan></text><text x="542.5" y="571" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="542.5" dy="0">7 All approvals complete -&gt; TR-04; allocate approved quantity</tspan></text><rect x="816" y="582" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="820.0" y="593.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="820.0" dy="0"></tspan></text><text x="242.85000000000002" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="242.85000000000002" dy="0">8 Releasing custodian confirms handover and</tspan><tspan x="242.85000000000002" dy="21.599999999999998">condition</tspan></text><rect x="261" y="653" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="265.0" y="664.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="265.0" dy="0"></tspan></text><text x="542.5" y="691" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="542.5" dy="0">9 TR-05 / AS-05; releasing department remains owner</tspan></text><rect x="816" y="702" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="820.0" y="713.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="820.0" dy="0"></tspan></text><text x="247.8" y="740" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="247.8" dy="0">10 Receiving custodian confirms quantity and</tspan><tspan x="247.8" dy="21.599999999999998">condition</tspan></text><rect x="261" y="773" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="265.0" y="784.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="265.0" dy="0"></tspan></text><text x="542.5" y="854" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="542.5" dy="0">11a Atomic receipt: TR-06 / RQ-06; AS-02 or AS-03; new owner,</tspan><tspan x="542.5" dy="21.599999999999998">custody, location</tspan></text><rect x="816" y="887" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="820.0" y="898.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="820.0" dy="0"></tspan></text><text x="237.9" y="925" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="237.9" dy="0">12a Confirm completed receipt and restored</tspan><tspan x="237.9" dy="21.599999999999998">asset state</tspan></text><text x="22" y="1003" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#172d27"><tspan x="22" dy="0">[quantity or condition differs]</tspan></text><text x="542.5" y="1039" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="542.5" dy="0">11b Save TR-07 and reason; keep owner; append audit</tspan></text><rect x="816" y="1050" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="820.0" y="1061.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="820.0" dy="0"></tspan></text><text x="357.5" y="1088" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="357.5" dy="0">12b Notify both representatives to resolve or</tspan><tspan x="357.5" dy="21.599999999999998">arrange return</tspan></text><rect x="446" y="1121" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="450.0" y="1132.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0"></tspan></text><rect x="10" y="793" width="880" height="353" fill="none" stroke="#6e8378"/><rect x="10" y="793" width="42" height="27" rx="0" fill="white" stroke="#385247"/><text x="31.0" y="811.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><tspan x="31.0" dy="0">alt</tspan></text><text x="64" y="813" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#172d27"><tspan x="64" dy="0">[agreed receipt]</tspan></text><rect x="15" y="1166" width="870" height="85" rx="0" fill="#fff6e3" stroke="#385247"/><text x="450.0" y="1193.8799999999999" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0">Dispute resolution permits receipt, or return with TR-09 and released quantity. Rejection</tspan><tspan x="450.0" dy="20.4">-&gt; TR-08; pre-handover cancellation -&gt; TR-09. Record reasons, release held units once and</tspan><tspan x="450.0" dy="20.4">notify.</tspan></text><text x="450.0" y="1293" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0">Dawra Campus | Zayed Alfadli 100064657 | UC-08, UC-09; FR-10, FR-11; BR-02, BR-05, BR-06, BR-13</tspan></text></svg>