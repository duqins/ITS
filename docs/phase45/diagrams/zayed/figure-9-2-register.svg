h="8" height="213" fill="#cfdfd4" stroke="#385247"/><rect x="821.0" y="1182" width="8" height="12" fill="#cfdfd4" stroke="#385247"/><rect x="371.0" y="1040" width="8" height="213" fill="#cfdfd4" stroke="#385247"/><rect x="521.0" y="1373" width="8" height="213" fill="#cfdfd4" stroke="#385247"/><rect x="671.0" y="301" width="8" height="392" fill="#cfdfd4" stroke="#385247"/><rect x="821.0" y="1444" width="8" height="71" fill="#cfdfd4" stroke="#385247"/><rect x="221.0" y="1324" width="8" height="262" fill="#cfdfd4" stroke="#385247"/><rect x="5.0" y="58" width="140" height="74" rx="0" fill="#f0f5f1" stroke="#385247"/><text x="75.0" y="90.84" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="75.0" dy="0">Asset custodian</tspan><tspan x="75.0" dy="19.2">(creator)</tspan></text><rect x="155.0" y="58" width="140" height="74" rx="0" fill="#f0f5f1" stroke="#385247"/><text x="225.0" y="81.24" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="225.0" dy="0">Second custodian</tspan><tspan x="225.0" dy="19.2">or Department</tspan><tspan x="225.0" dy="19.2">representative</tspan></text><rect x="305.0" y="58" width="140" height="74" rx="0" fill="#f0f5f1" stroke="#385247"/><text x="375.0" y="100.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="375.0" dy="0">UI-03</tspan></text><rect x="455.0" y="58" width="140" height="74" rx="0" fill="#f0f5f1" stroke="#385247"/><text x="525.0" y="90.84" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="525.0" dy="0">Asset module</tspan><tspan x="525.0" dy="19.2">Django</tspan></text><rect x="605.0" y="58" width="140" height="74" rx="0" fill="#f0f5f1" stroke="#385247"/><text x="675.0" y="100.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="675.0" dy="0">AI provider</tspan></text><rect x="755.0" y="58" width="140" height="74" rx="0" fill="#f0f5f1" stroke="#385247"/><text x="825.0" y="81.24" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="825.0" dy="0">PostgreSQL</tspan><tspan x="825.0" dy="19.2">records and</tspan><tspan x="825.0" dy="19.2">audit</tspan></text><text x="225.0" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="225.0" dy="0">1 Enter fields and request suggestions</tspan></text><text x="450.0" y="219" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="450.0" dy="0">2 Validate access, text and supported files</tspan></text><text x="600.0" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="600.0" dy="0">3 Send permitted asset content; 15 s from the</tspan><tspan x="600.0" dy="21.599999999999998">user request</tspan></text><text x="600.0" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="600.0" dy="0">4 Return suggested values and available</tspan><tspan x="600.0" dy="21.599999999999998">confidence</tspan></text><text x="675.0" y="453" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="675.0" dy="0">5 Record output, confidence and</tspan><tspan x="675.0" dy="21.599999999999998">model/version, or unavailable</tspan></text><text x="450.0" y="524" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="450.0" dy="0">6 Fill suggestions for review; label missing</tspan><tspan x="450.0" dy="21.599999999999998">confidence &quot;Confidence unavailable - check</tspan><tspan x="450.0" dy="21.599999999999998">carefully&quot;</tspan></text><text x="22" y="624" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="22" dy="0">[usable response; confidence &lt; 0.60]</tspan></text><text x="600.0" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="600.0" dy="0">4b Return suggested values with confidence</tspan><tspan x="600.0" dy="21.599999999999998">below 0.60</tspan></text><text x="675.0" y="731" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="675.0" dy="0">5b Record suggestion, confidence and</tspan><tspan x="675.0" dy="21.599999999999998">model/version, or unavailable</tspan></text><text x="450.0" y="802" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="450.0" dy="0">6b Do not fill fields; keep entered values;</tspan><tspan x="450.0" dy="21.599999999999998">list suggestions as options only</tspan></text><text x="22" y="880" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="22" dy="0">[unsupported input, failure or timeout]</tspan></text><text x="450.0" y="916" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="450.0" dy="0">6c Keep entered values; show manual entry</tspan><tspan x="450.0" dy="21.599999999999998">within 15 s</tspan></text><rect x="10" y="321" width="880" height="653" fill="none" stroke="#6e8378"/><rect x="10" y="321" width="42" height="27" rx="0" fill="white" stroke="#385247"/><text x="31.0" y="339.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><tspan x="31.0" dy="0">alt</tspan></text><text x="64" y="341" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="64" dy="0">[usable response; confidence &gt;= 0.60 or unavailable]</tspan></text><text x="247.8" y="1007" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="247.8" dy="0">7 Accept, edit or reject suggestions; submit</tspan><tspan x="247.8" dy="21.599999999999998">the record</tspan></text><text x="450.0" y="1078" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="450.0" dy="0">8 Submit; repeat validation and duplicate</tspan><tspan x="450.0" dy="21.599999999999998">check</tspan></text><text x="672.0" y="1149" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="672.0" dy="0">9 Save reviewed values and AI responses;</tspan><tspan x="672.0" dy="21.599999999999998">record stays AS-01</tspan></text><text x="450.0" y="1220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="450.0" dy="0">10 Show Draft awaiting independent</tspan><tspan x="450.0" dy="21.599999999999998">confirmation</tspan></text><text x="375.0" y="1291" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="375.0" dy="0">11 Assign confirmation to an eligible user</tspan><tspan x="375.0" dy="21.599999999999998">other than the creator (BR-02)</tspan></text><text x="375.0" y="1362" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="375.0" dy="0">12 Check evidence; confirm the asset (UC-08)</tspan></text><text x="672.0" y="1411" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="672.0" dy="0">13 Verify confirmer is not the creator;</tspan><tspan x="672.0" dy="21.599999999999998">transaction: AS-01 to AS-02/AS-03; audit</tspan></text><text x="675.0" y="1482" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="675.0" dy="0">14 Commit one record and confirmation</tspan><tspan x="675.0" dy="21.599999999999998">evidence</tspan></text><text x="375.0" y="1553" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="375.0" dy="0">15 Show confirmed state and saved</tspan><tspan x="375.0" dy="21.599999999999998">verification details</tspan></text><rect x="15" y="1611" width="870" height="64" rx="0" fill="#fff6e3" stroke="#385247"/><text x="450.0" y="1638.58" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0">Invalid fields retain AS-01. Duplicate warning needs confirmation. Correction/rejection</tspan><tspan x="450.0" dy="20.4">needs a reason. A rejected or ineligible confirmation keeps AS-01 with the reason.</tspan></text></svg>