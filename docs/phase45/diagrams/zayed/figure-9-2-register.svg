Django</tspan></text><rect x="559" y="58" width="152" height="74" rx="0" fill="#f0f5f1" stroke="#385247"/><text x="635.0" y="100.78" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#172d27"><tspan x="635.0" dy="0">AI provider</tspan></text><rect x="744" y="58" width="152" height="74" rx="0" fill="#f0f5f1" stroke="#385247"/><text x="820.0" y="90.58" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#172d27"><tspan x="820.0" dy="0">PostgreSQL</tspan><tspan x="820.0" dy="20.4">records and audit</tspan></text><text x="218.10000000000002" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="218.10000000000002" dy="0">1 Enter fields and request suggestions</tspan></text><rect x="261" y="181" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="265.0" y="192.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="265.0" dy="0"></tspan></text><text x="357.5" y="219" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="357.5" dy="0">2 Validate access, text and supported files</tspan></text><rect x="446" y="230" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="450.0" y="241.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0"></tspan></text><text x="542.5" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="542.5" dy="0">3 Send permitted asset content; start 15 s</tspan><tspan x="542.5" dy="21.599999999999998">deadline</tspan></text><rect x="631" y="301" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="635.0" y="312.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="635.0" dy="0"></tspan></text><text x="542.5" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="542.5" dy="0">4 Return suggested values and supported</tspan><tspan x="542.5" dy="21.599999999999998">confidence</tspan></text><text x="635.0" y="453" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="635.0" dy="0">5 Record output, model/version or unavailable</tspan></text><rect x="816" y="464" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="820.0" y="475.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="820.0" dy="0"></tspan></text><text x="357.5" y="502" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="357.5" dy="0">6 Show suggestions &gt;= 0.60 for review</tspan></text><text x="22" y="558" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#172d27"><tspan x="22" dy="0">[response confidence &lt; 0.60 or unavailable]</tspan></text><text x="542.5" y="594" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="542.5" dy="0">4b Return low or unavailable confidence; do</tspan><tspan x="542.5" dy="21.599999999999998">not fill fields</tspan></text><text x="635.0" y="665" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="635.0" dy="0">5b Record suggestion, confidence and model or</tspan><tspan x="635.0" dy="21.599999999999998">unavailable</tspan></text><rect x="816" y="698" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="820.0" y="709.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="820.0" dy="0"></tspan></text><text x="357.5" y="736" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="357.5" dy="0">6b Keep entered values; show option only for</tspan><tspan x="357.5" dy="21.599999999999998">manual review</tspan></text><text x="22" y="814" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#172d27"><tspan x="22" dy="0">[unsupported input, failure or timeout]</tspan></text><text x="357.5" y="850" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="357.5" dy="0">6c Keep entered values; show manual entry</tspan><tspan x="357.5" dy="21.599999999999998">within 15 s</tspan></text><rect x="10" y="321" width="880" height="587" fill="none" stroke="#6e8378"/><rect x="10" y="321" width="42" height="27" rx="0" fill="white" stroke="#385247"/><text x="31.0" y="339.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><tspan x="31.0" dy="0">alt</tspan></text><text x="64" y="341" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#172d27"><tspan x="64" dy="0">[usable response; confidence &gt;= 0.60]</tspan></text><text x="223.05" y="941" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="223.05" dy="0">7 Accept, edit or reject; confirm exact</tspan><tspan x="223.05" dy="21.599999999999998">values</tspan></text><rect x="261" y="974" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="265.0" y="985.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="265.0" dy="0"></tspan></text><text x="357.5" y="1012" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="357.5" dy="0">8 Confirm asset; repeat validation and</tspan><tspan x="357.5" dy="21.599999999999998">duplicate check</tspan></text><rect x="446" y="1045" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="450.0" y="1056.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0"></tspan></text><text x="635.0" y="1083" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="635.0" dy="0">9 Transaction: AS-01 to AS-02/AS-03; AI</tspan><tspan x="635.0" dy="21.599999999999998">response; audit</tspan></text><rect x="816" y="1116" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="820.0" y="1127.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="820.0" dy="0"></tspan></text><text x="635.0" y="1154" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="635.0" dy="0">10 Commit one record and confirmation</tspan><tspan x="635.0" dy="21.599999999999998">evidence</tspan></text><text x="357.5" y="1225" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="357.5" dy="0">11 Show state and saved verification details</tspan></text><rect x="15" y="1261" width="870" height="64" rx="0" fill="#fff6e3" stroke="#385247"/><text x="450.0" y="1288.58" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0">Invalid fields retain AS-01. Duplicate warning needs confirmation. Correction/rejection</tspan><tspan x="450.0" dy="20.4">needs a reason.</tspan></text><text x="450.0" y="1367" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0">Dawra Campus | Zayed Alfadli 100064657 | UC-02; UI-03; FR-04; AI-01, AI-12, AI-13; AS-01 to AS-03</tspan></text></svg>