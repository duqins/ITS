eight="normal" fill="#172d27"><tspan x="820.0" dy="0">PostgreSQL</tspan><tspan x="820.0" dy="20.4">records and audit</tspan></text><text x="252.75000000000003" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="252.75000000000003" dy="0">1 Enter quantity, purpose, specifications and</tspan><tspan x="252.75000000000003" dy="21.599999999999998">date</tspan></text><rect x="261" y="203" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="265.0" y="214.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="265.0" dy="0"></tspan></text><text x="357.5" y="241" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="357.5" dy="0">2 Submit request; validate access and fields</tspan></text><rect x="446" y="252" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="450.0" y="263.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0"></tspan></text><text x="635.0" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="635.0" dy="0">3 Save ResourceRequest RQ-02 and task AT-01</tspan></text><rect x="816" y="301" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="820.0" y="312.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="820.0" dy="0"></tspan></text><text x="542.5" y="339" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="542.5" dy="0">4 Notify assigned department representative</tspan></text><rect x="631" y="350" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="635.0" y="361.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="635.0" dy="0"></tspan></text><text x="450.0" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0">5 Open task; review request and current</tspan><tspan x="450.0" dy="21.599999999999998">version</tspan></text><rect x="261" y="421" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="265.0" y="432.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="265.0" dy="0"></tspan></text><text x="357.5" y="459" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="357.5" dy="0">6 Approve, reject or request changes; submit</tspan><tspan x="357.5" dy="21.599999999999998">reason</tspan></text><rect x="446" y="492" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="450.0" y="503.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0"></tspan></text><text x="635.0" y="530" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="635.0" dy="0">7 Verify role, not creator/requester, version</tspan><tspan x="635.0" dy="21.599999999999998">and pending task</tspan></text><rect x="816" y="563" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="820.0" y="574.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="820.0" dy="0"></tspan></text><text x="635.0" y="644" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="635.0" dy="0">8 Approve: AT-02 and RQ-03 Open; append audit</tspan></text><rect x="816" y="655" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="820.0" y="666.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="820.0" dy="0"></tspan></text><text x="265.0" y="693" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="265.0" dy="0">9 Notify decision and next step</tspan></text><text x="22" y="749" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#172d27"><tspan x="22" dy="0">[authorised rejection with reason]</tspan></text><text x="635.0" y="785" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="635.0" dy="0">8b Save AT-03 / RQ-08 and reason; append</tspan><tspan x="635.0" dy="21.599999999999998">audit</tspan></text><rect x="816" y="818" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="820.0" y="829.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="820.0" dy="0"></tspan></text><text x="265.0" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="265.0" dy="0">9b Notify rejection and reason</tspan></text><text x="22" y="912" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#172d27"><tspan x="22" dy="0">[authorised request for changes with reason]</tspan></text><text x="635.0" y="948" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="635.0" dy="0">8c Save AT-04 / RQ-01 and reason; append</tspan><tspan x="635.0" dy="21.599999999999998">audit</tspan></text><rect x="816" y="981" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="820.0" y="992.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="820.0" dy="0"></tspan></text><text x="265.0" y="1019" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="265.0" dy="0">9c Notify required edits; resubmission</tspan><tspan x="265.0" dy="21.599999999999998">creates a new task</tspan></text><rect x="10" y="583" width="880" height="494" fill="none" stroke="#6e8378"/><rect x="10" y="583" width="42" height="27" rx="0" fill="white" stroke="#385247"/><text x="31.0" y="601.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><tspan x="31.0" dy="0">alt</tspan></text><text x="64" y="603" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#172d27"><tspan x="64" dy="0">[authorised approval]</tspan></text><rect x="15" y="1097" width="870" height="64" rx="0" fill="#fff6e3" stroke="#385247"/><text x="450.0" y="1124.58" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0">Invalid date or quantity: retain draft and errors. Self-approval or stale version: refuse</tspan><tspan x="450.0" dy="20.4">and audit; no state change.</tspan></text></svg>