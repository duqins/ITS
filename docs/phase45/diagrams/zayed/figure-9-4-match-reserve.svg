 representative</tspan></text><rect x="744" y="58" width="152" height="74" rx="0" fill="#f0f5f1" stroke="#385247"/><text x="820.0" y="90.58" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#172d27"><tspan x="820.0" dy="0">PostgreSQL</tspan><tspan x="820.0" dy="20.4">records and audit</tspan></text><text x="237.9" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="237.9" dy="0">1 Request matches for Open ResourceRequest</tspan><tspan x="237.9" dy="21.599999999999998">RQ-03</tspan></text><rect x="261" y="203" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="265.0" y="214.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="265.0" dy="0"></tspan></text><text x="542.5" y="241" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="542.5" dy="0">2 Read permitted Published listings; classic BR-14 checks</tspan></text><rect x="816" y="252" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="820.0" y="263.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="820.0" dy="0"></tspan></text><text x="357.5" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="357.5" dy="0">3 Rank eligible items if AI enabled; 15 s</tspan><tspan x="357.5" dy="21.599999999999998">including retries</tspan></text><rect x="446" y="323" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="450.0" y="334.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0"></tspan></text><text x="357.5" y="404" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="357.5" dy="0">4a Return similarity, reasons, confidence and</tspan><tspan x="357.5" dy="21.599999999999998">model</tspan></text><text x="203.25" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="203.25" dy="0">5a Show ranked eligible matches and</tspan><tspan x="203.25" dy="21.599999999999998">confidence warning</tspan></text><text x="22" y="553" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#172d27"><tspan x="22" dy="0">[AI disabled, failure, timeout, invalid output, rate limit or confidence &lt; 0.50]</tspan></text><text x="542.5" y="589" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="542.5" dy="0">4b Run classic keyword and rule search; enforce BR-14 eligibility</tspan></text><rect x="816" y="600" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="820.0" y="611.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="820.0" dy="0"></tspan></text><text x="252.75000000000003" y="638" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="252.75000000000003" dy="0">5b Show classic results and AI warning within</tspan><tspan x="252.75000000000003" dy="21.599999999999998">15 s</tspan></text><rect x="10" y="343" width="880" height="353" fill="none" stroke="#6e8378"/><rect x="10" y="343" width="42" height="27" rx="0" fill="white" stroke="#385247"/><text x="31.0" y="361.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172d27"><tspan x="31.0" dy="0">alt</tspan></text><text x="64" y="363" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#172d27"><tspan x="64" dy="0">[usable response; confidence &gt;= 0.50 or unavailable]</tspan></text><rect x="15" y="716" width="870" height="106" rx="0" fill="#fff6e3" stroke="#385247"/><text x="450.0" y="744.18" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0">&gt;= 0.75: normal. 0.50 to &lt; 0.75: Check carefully. Unavailable confidence: label</tspan><tspan x="450.0" dy="20.4">unavailable.</tspan><tspan x="450.0" dy="20.4">Fallback: withhold unusable AI recommendations; classic results have no fabricated AI</tspan><tspan x="450.0" dy="20.4">score.</tspan></text><text x="232.95000000000002" y="855" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="232.95000000000002" dy="0">6 Choose item; override reason if another</tspan><tspan x="232.95000000000002" dy="21.599999999999998">ranked result</tspan></text><rect x="261" y="888" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="265.0" y="899.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="265.0" dy="0"></tspan></text><text x="542.5" y="926" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="542.5" dy="0">7 Recheck RQ-03, LS-03, quantity; save RV-01 / RQ-04</tspan></text><rect x="816" y="937" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="820.0" y="948.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#172d27"><tspan x="820.0" dy="0"></tspan></text><text x="450.0" y="975" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#172d27"><tspan x="450.0" dy="0">8 Request independent hold confirmation;</tspan><tspan x="450.0" dy="21.599999999999998">verify if &gt;90 days</tspan></text><rect x="631" y="1008" width="8" height="12" rx="0" fill="#cfdfd4" stroke="#385247"/><text x="635.0" y="1019.44" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" 