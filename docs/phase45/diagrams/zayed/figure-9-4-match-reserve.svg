-weight="normal" fill="#172d27"><tspan x="450.0" dy="0">Dawra Campus | Zayed Alfadli 100064657 | UC-05 to UC-07; FR-09; AI-02 to AI-05, AI-13; BR-11 to BR-16</tspan></text></svg>